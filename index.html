<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter Ringkas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-wrapper">
    <!-- Papan Maklumat Atas (HUD) -->
    <header class="hud">
      <div>Score: <span id="scoreDisplay">0</span> / 500</div>
      <div>Lives: <span id="livesDisplay">❤️❤️❤️</span></div>
    </header>

    <!-- Kanvas Permainan -->
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <!-- Skrin Mula & Arahan -->
    <div id="startScreen" class="overlay">
      <div class="card">
        <h1>SPACE SHOOTER</h1>
        <p>Protect our ship from the meteor!</p>
        <div class="instructions">
          <p><strong>Controls:</strong></p>
          <p>← / → or A / D : Click Left / Right</p>
          <p>Spacebar atau Click Mouse : Shoot</p>
          <p><strong>Mission:</strong> Achieve 500 points to win. Don't let all 3 lives run out!</p>
        </div>
        <button id="startBtn" class="btn">Game Start</button>
      </div>
    </div>

    <!-- Skrin Tamat / Menang -->
    <div id="gameOverScreen" class="overlay hidden">
      <div class="card">
        <h2 id="endTitle">Game Over</h2>
        <p id="endMessage">Last Score: 0</p>
        <button id="restartBtn" class="btn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
